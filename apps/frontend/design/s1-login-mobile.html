<style>
    .material-symbols-outlined {
      font-variation-settings: 'FILL' 0, 'wght' 300, 'GRAD' 0, 'opsz' 20;
    }
    /* Subtle warm lamp gradient centered at the top */
    .sanctuary-glow {
      background: radial-gradient(circle at 50% 12%, rgba(212, 155, 68, 0.05) 0%, rgba(21, 19, 15, 0) 70%);
    }
  </style>
<style>
    body {
      min-height: max(884px, 100dvh);
    }
  </style>

<body class="bg-background text-on-surface antialiased min-h-screen flex items-center justify-center p-0 m-0 selection:bg-primary-container selection:text-on-primary">
<!-- Mobile Viewport Wrapper (390px canonical mobile canvas) -->
<main class="w-full max-w-[390px] min-h-screen flex flex-col justify-between px-space-xl py-space-xl sanctuary-glow relative">
<!-- Top Atmospheric Spacer for Vertical Calibration -->
<div class="h-8 shrink-0"></div>
<!-- Central Focus Group -->
<div class="w-full flex flex-col items-center my-auto">
<!-- Brand & Literary Identity Header -->
<header class="w-full text-center flex flex-col items-center mb-space-xl">
<h1 class="font-wordmark text-wordmark text-on-surface tracking-[0.22em] uppercase select-none">
          WANDERLORE
        </h1>
<p class="text-ui-body text-outline mt-space-sm max-w-[280px] leading-relaxed font-prose-narrative-mobile">
          Your solo tabletop adventure, with a game master who never cancels.
        </p>
</header>
<!-- Ledger Sign-in Form -->
<form class="w-full flex flex-col gap-space-md" onsubmit="event.preventDefault(); document.getElementById('error-banner').classList.remove('hidden');">
<!-- Field: Email -->
<div class="w-full flex flex-col gap-space-xs text-left">
<label class="font-ui-label text-ui-label text-on-surface-variant" for="email-input">
            Email
          </label>
<input autocomplete="email" class="w-full h-11 px-3 bg-surface-container-low border border-outline-variant rounded-lg font-ui-body text-ui-body text-on-surface placeholder:text-outline/60 focus:outline-none focus:border-primary-container focus:ring-0 transition-colors duration-150" id="email-input" name="email" placeholder="chronicler@wanderlore.io" required="" type="email">
</div>
<!-- Field: Password -->
<div class="w-full flex flex-col gap-space-xs text-left">
<label class="font-ui-label text-ui-label text-on-surface-variant" for="password-input">
            Password
          </label>
<input autocomplete="current-password" class="w-full h-11 px-3 bg-surface-container-low border border-outline-variant rounded-lg font-ui-body text-ui-body text-on-surface placeholder:text-outline/60 focus:outline-none focus:border-primary-container focus:ring-0 transition-colors duration-150" id="password-input" name="password" placeholder="••••••••••••" required="" type="password">
</div>
<!-- Primary Action Trigger -->
<div class="pt-space-xs">
<button class="w-full h-11 bg-primary-container hover:bg-[#c88d37] active:bg-[#ba802e] text-on-primary rounded-lg font-ui-body-strong text-ui-body-strong transition-colors duration-150 flex items-center justify-center tracking-normal cursor-pointer select-none" type="submit">
            Sign in
          </button>
</div>
<!-- Inline Error Message: Restrained & Literary -->
<div aria-live="polite" class="w-full flex items-center justify-center gap-space-xs text-on-tertiary-container pt-space-xs" id="error-banner" role="alert">
<span aria-hidden="true" class="material-symbols-outlined text-[16px] text-tertiary-container select-none" data-icon="error">error</span>
<span class="font-ui-label text-ui-label text-tertiary-container">
            Invalid email or password.
          </span>
</div>
</form>
</div>
<!-- Bottom Atmospheric Anchor for Quiet Balance -->
<div class="h-8 shrink-0"></div>
</main>


</body></html>
