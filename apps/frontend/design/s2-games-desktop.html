<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Wanderlore - My Games</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600&family=Literata:ital,opsz,wght@0,7..72,300;0,7..72,400;0,7..72,500;0,7..72,600;1,7..72,400&display=swap" rel="stylesheet">
  <script src="https://cdn.tailwindcss.com"></script>
  <script>
    tailwind.config = {
      theme: {
        extend: {
          colors: {
            background: '#15130F',
            surface: '#1D1B17',
            'surface-hover': '#24211C',
            'cream-text': '#EDE6D6',
            'cream-muted': '#A69F90',
            'cream-subtle': '#6B665E',
            border: '#2E2B25',
            'border-hover': '#423E35',
            brass: '#d49b44',
            sage: '#6D8A68',
            'sage-bg': 'rgba(109, 138, 104, 0.12)',
            'sage-border': 'rgba(109, 138, 104, 0.28)',
            'status-paused': '#9E978C',
            'status-paused-bg': 'rgba(158, 151, 140, 0.10)',
            'status-paused-border': 'rgba(158, 151, 140, 0.22)',
            brick: '#B85D43'
          },
          fontFamily: {
            serif: ['Literata', 'Georgia', 'serif'],
            sans: ['Inter', '-apple-system', 'BlinkMacSystemFont', 'sans-serif'],
          }
        }
      }
    }
  </script>
  <style>
    body {
      background-color: #15130F;
      color: #EDE6D6;
      font-family: 'Inter', sans-serif;
      min-height: 100vh;
    }
    .wordmark {
      font-family: 'Literata', Georgia, serif;
      letter-spacing: 0.22em;
      font-variant: small-caps;
    }
    .serif-heading {
      font-family: 'Literata', Georgia, serif;
    }
  </style>
</head>
<body class="bg-background text-cream-text min-h-screen flex flex-col antialiased selection:bg-brass/20 selection:text-cream-text">

  <!-- Top Bar -->
  <header class="w-full border-b border-border/80 bg-background/95 backdrop-blur-sm sticky top-0 z-20">
    <div class="max-w-[1440px] mx-auto px-12 h-20 flex items-center justify-between">
      <!-- Wordmark alone (no logo icon) -->
      <a href="#" class="wordmark text-cream-text text-lg font-medium tracking-[0.22em] uppercase hover:text-brass transition-colors duration-150">
        Wanderlore
      </a>

      <!-- Account initials button DA -->
      <button type="button" aria-label="Account DA" class="w-10 h-10 rounded-full border border-border bg-surface flex items-center justify-center text-xs font-semibold text-brass hover:border-brass/50 hover:bg-surface-hover transition-all duration-150 focus:outline-none focus:ring-1 focus:ring-brass/60">
        DA
      </button>
    </div>
  </header>

  <!-- Main Content Column -->
  <main class="w-full flex-1">
    <div class="max-w-[720px] mx-auto px-6 pt-16 pb-24">
      
      <!-- Page title alone -->
      <h1 class="serif-heading text-4xl font-normal tracking-tight text-cream-text mb-10">
        My games
      </h1>

      <!-- Game Cards List -->
      <div class="flex flex-col gap-4">

        <!-- Card 1: d'Artagnan -->
        <a href="#" class="group block w-full bg-surface border border-border rounded-lg p-6 hover:bg-surface-hover hover:border-border-hover transition-all duration-150 focus:outline-none focus:ring-1 focus:ring-brass/40">
          <div class="flex items-start justify-between gap-4 mb-2.5">
            <h2 class="serif-heading text-2xl font-normal text-cream-text group-hover:text-brass transition-colors duration-150 leading-snug">
              d'Artagnan
            </h2>
            <span class="inline-flex items-center gap-1.5 px-2.5 py-1 rounded text-xs font-medium uppercase tracking-wider text-sage bg-sage-bg border border-sage-border shrink-0">
              <span class="w-1.5 h-1.5 rounded-full bg-sage"></span>
              In progress
            </span>
          </div>

          <p class="font-serif italic text-cream-muted text-base mb-6 font-normal">
            The Three Musketeers · The Road to Paris
          </p>

          <div class="flex items-center justify-between text-xs text-cream-muted font-sans pt-1">
            <!-- Hit points indicator with heart icon -->
            <div class="flex items-center gap-2">
              <svg class="w-4 h-4 text-brick fill-brick/20 stroke-current stroke-[1.75]" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-linecap="round" stroke-linejoin="round">
                <path d="M19 14c1.49-1.46 3-3.21 3-5.5A5.5 5.5 0 0 0 16.5 3c-1.76 0-3 .5-4.5 2-1.5-1.5-2.74-2-4.5-2A5.5 5.5 0 0 0 2 8.5c0 2.3 1.5 4.05 3 5.5l7 7Z"/>
              </svg>
              <span class="text-cream-muted text-sm font-medium">
                <strong class="text-cream-text font-medium">8</strong> / 10
              </span>
            </div>

            <!-- Relative time -->
            <div class="flex items-center gap-1.5 text-cream-subtle text-sm">
              <svg class="w-3.5 h-3.5 stroke-current stroke-[1.75]" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-linecap="round" stroke-linejoin="round">
                <circle cx="12" cy="12" r="10"/>
                <polyline points="12 6 12 12 16 14"/>
              </svg>
              <span>2 hours ago</span>
            </div>
          </div>
        </a>

        <!-- Card 2: Constance Bonacieux -->
        <a href="#" class="group block w-full bg-surface border border-border rounded-lg p-6 hover:bg-surface-hover hover:border-border-hover transition-all duration-150 focus:outline-none focus:ring-1 focus:ring-brass/40">
          <div class="flex items-start justify-between gap-4 mb-2.5">
            <h2 class="serif-heading text-2xl font-normal text-cream-text group-hover:text-brass transition-colors duration-150 leading-snug">
              Constance Bonacieux
            </h2>
            <span class="inline-flex items-center gap-1.5 px-2.5 py-1 rounded text-xs font-medium uppercase tracking-wider text-status-paused bg-status-paused-bg border border-status-paused-border shrink-0">
              <span class="w-1.5 h-1.5 rounded-full bg-status-paused"></span>
              Paused
            </span>
          </div>

          <p class="font-serif italic text-cream-muted text-base mb-6 font-normal">
            The Three Musketeers · The Road to Paris
          </p>

          <div class="flex items-center justify-between text-xs text-cream-muted font-sans pt-1">
            <!-- Hit points indicator with heart icon -->
            <div class="flex items-center gap-2">
              <svg class="w-4 h-4 text-brick fill-brick/20 stroke-current stroke-[1.75]" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-linecap="round" stroke-linejoin="round">
                <path d="M19 14c1.49-1.46 3-3.21 3-5.5A5.5 5.5 0 0 0 16.5 3c-1.76 0-3 .5-4.5 2-1.5-1.5-2.74-2-4.5-2A5.5 5.5 0 0 0 2 8.5c0 2.3 1.5 4.05 3 5.5l7 7Z"/>
              </svg>
              <span class="text-cream-muted text-sm font-medium">
                <strong class="text-cream-text font-medium">5</strong> / 10
              </span>
            </div>

            <!-- Relative time -->
            <div class="flex items-center gap-1.5 text-cream-subtle text-sm">
              <svg class="w-3.5 h-3.5 stroke-current stroke-[1.75]" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-linecap="round" stroke-linejoin="round">
                <circle cx="12" cy="12" r="10"/>
                <polyline points="12 6 12 12 16 14"/>
              </svg>
              <span>3 days ago</span>
            </div>
          </div>
        </a>

      </div>

      <!-- Empty space below cards as required -->
    </div>
  </main>

</body>
</html>
