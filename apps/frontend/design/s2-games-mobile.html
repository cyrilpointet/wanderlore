<body class="bg-background text-on-surface min-h-screen flex flex-col antialiased selection:bg-primary-container selection:text-on-primary-container pb-24">
<!-- Top Navigation Bar -->
<header class="bg-surface-container-low sticky top-0 z-40 w-full transition-all duration-150">
<div class="flex justify-between items-center w-full px-6 py-3.5 max-w-7xl mx-auto">

</div>

</button>
</div>
</header>
<!-- Main View Container -->
<main class="flex-1 w-full max-w-md mx-auto px-6 pt-7 pb-6 flex flex-col justify-start">

<section class="mb-8">
<div class="flex items-baseline justify-between mb-1.5">
<h1 class="font-headline-xl-mobile text-headline-xl-mobile text-on-surface font-medium tracking-tight">
          My games
        </h1>

</div>

</section>
<!-- Games Ledger List -->
<div class="space-y-4">
<!-- Card 1: d'Artagnan -->
<article class="group relative bg-surface-container-low rounded-lg p-5 border border-outline-variant/30 hover:border-primary-container/60 active:scale-[0.99] transition-all duration-150 ease-out cursor-pointer focus:outline-none focus:border-primary-container" role="button" tabindex="0">

<div class="flex items-start justify-between gap-2 mb-2">
<h2 class="font-headline-sm text-headline-sm text-on-surface group-hover:text-primary transition-colors duration-150 font-normal">
            d'Artagnan
          </h2>
<!-- Status Badge: In Progress (Sage) -->
<div class="inline-flex items-center gap-1.5 px-2 py-0.5 rounded bg-secondary-container/40 border border-secondary-container text-secondary font-ui-meta text-ui-meta tracking-wide uppercase">
<span class="w-1.5 h-1.5 rounded-full bg-secondary"></span>
<span class="">In progress</span>
</div>
</div>
<!-- Subtitle & Storyline -->
<p class="font-prose-caption text-prose-caption text-on-surface-variant mb-5 line-clamp-1 italic">

        </p>

<div class="pt-3 border-t border-outline-variant/20 flex items-center justify-between font-ui-meta text-ui-meta text-on-surface-variant">

<div class="flex items-center gap-1.5" title="Vitality: 8 of 10">
<span class="material-symbols-outlined text-tertiary-container text-base leading-none select-none">favorite</span>
<span class="font-ui-body-strong text-on-surface tracking-tight">8 <span class="text-on-surface-variant/50 font-normal">/ 10</span></span>
</div>

<div class="flex items-center gap-1 text-on-surface-variant/70">
<span class="material-symbols-outlined text-sm select-none">schedule</span>
<span class="">2 hours ago</span>
</div>
</div>
</article>
