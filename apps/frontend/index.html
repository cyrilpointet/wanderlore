<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta name="color-scheme" content="light dark" />
    <title>Wanderlore</title>
    <!--
      Applies the theme before the first paint, so a dark-theme player never
      sees a light flash. Mirrors src/theme.ts and the theme key of
      src/preferences.ts, which own the logic afterwards: light unless the
      player chose dark, or chose to follow a system that asks for dark.
    -->
    <script>
      try {
        var choice = localStorage.getItem('wanderlore.theme')
        var dark =
          choice === 'dark' ||
          (choice === 'system' && matchMedia('(prefers-color-scheme: dark)').matches)
        document.documentElement.dataset.theme = dark ? 'dark' : 'light'
      } catch (e) {
        document.documentElement.dataset.theme = 'light'
      }
    </script>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
